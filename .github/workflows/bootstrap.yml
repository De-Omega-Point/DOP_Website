name: Assemble DOP Website

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/chunk-00 \
            .bootstrap/chunk-01 \
            .bootstrap/chunk-02-03 \
            .bootstrap/chunk-04-05 \
            .bootstrap/chunk-06-08 \
            | base64 --decode > /tmp/DOP_Website-source.tar.gz
          tar -xzf /tmp/DOP_Website-source.tar.gz -C .

          # The workflow token may update normal repository content, but GitHub
          # blocks it from creating or modifying workflow files without the
          # separate workflows permission. Those files are installed afterwards
          # through the authorised GitHub connector.
          rm -rf .github/workflows
          rm -rf .bootstrap

      - name: Commit full application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy complete De-Omega-Point website application"
          git push origin main
